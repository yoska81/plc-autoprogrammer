# Builds the Windows installer (Setup .exe) of ISA Auto Programmer.
# Every push to the integration branch (pushed once a day) and pull requests into it once they are marked
# ready for review (team drafts don't build): the installer is attached to the run as an artifact.
# A tag v* (e.g. v0.7.0): also published as a GitHub Release with the Setup .exe.
# Pushes to the integration branch: version 0.7.<run number>, published as a pre-release on the public
# releases-only repo the desktop app updates from (needs the RELEASES_TOKEN secret; skipped with a warning without it).
name: Windows installer

on:
  push:
    branches: [claude/optimistic-maxwell-6nfcs6]
    tags: ['v*']
  pull_request:
    branches: [claude/optimistic-maxwell-6nfcs6]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Vendor catalog data: every part needs a maker source, key ratings and a datasheet footprint.
  # Separate job: it stays red until the data is complete, without blocking the installer build.
  catalog-data:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/electrical/catalog.test.ts

  # Update-all speed: description → design with recorded AI replies (tools/bench-update.ts). Fails when the
  # app's own (non-AI) time gets slow; the modelled times with the AI are in the report artifact.
  update-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/bench-update.ts --max-non-ai-ms=5000
      - uses: actions/upload-artifact@v4
        with:
          name: update-speed-report
          path: tools/bench/out/report.md

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Builds of the integration branch get their own version, 0.7.<run number> (package.json is not committed):
      # the desktop app's updater sees each one as new.
      - name: Version of this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/optimistic-maxwell-6nfcs6'
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      # The TIA Portal bridge is C# (.NET Framework 4.8 exe, tests on .NET 8)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # GNU LibreDWG's dwg2dxf (opens DWG drawings): the official win64 build, pinned SHA-256, shipped as a
      # separate program in the installer. Before the tests: src/convert/dwgReader.test.ts runs the real one.
      - name: Fetch LibreDWG
        run: node scripts/fetch-libredwg.cjs

      - name: Lint and unit tests
        shell: bash
        run: |
          npx eslint src
          # Every unit-test suite in the repo (each exits non-zero on a failure).
          # The vendor catalog data check runs in its own job (catalog-data) so it never blocks the installer.
          for t in $(find src -name '*.test.ts' ! -name 'catalog.test.ts' | sort); do echo "== $t"; npx tsx "$t"; done
          node e2e/modbus.test.cjs
          node e2e/updater.test.cjs
          node e2e/tiaBridge.test.cjs
          node e2e/clickBridge.test.cjs
          node e2e/plcHelper.test.cjs

      # The TIA Portal bridge (tools/tia-bridge): its own tests (.NET 8), then the .NET Framework 4.8 exe the
      # installer ships, tried through the app's bridge client (no TIA Portal on the build server: detect says so).
      - name: TIA Portal bridge
        shell: bash
        run: |
          dotnet run --project tools/tia-bridge/tests -c Release
          node scripts/build-tia-bridge.cjs
          TIA_BRIDGE_EXE="$PWD/resources/tia-bridge/TiaBridge.exe" node e2e/tiaBridge.test.cjs

      # The CLICK bridge (tools/click-bridge): its own tests (.NET 8, a fake CLICK), then the exe the installer ships,
      # started through the app's client (no CLICK Programming Software on the build server: detect says so).
      - name: CLICK bridge
        shell: bash
        run: |
          dotnet run --project tools/click-bridge/tests -c Release
          node scripts/build-click-bridge.cjs
          CLICK_BRIDGE_EXE="$PWD/resources/click-bridge/ClickBridge.exe" node e2e/clickBridge.test.cjs

      # The CODESYS bridge (tools/codesys-bridge): its own tests (.NET 8, a fake CODESYS), the job script's tests
      # (python, a fake CODESYS ScriptEngine), then the exe the installer ships, started through the app's client.
      - name: CODESYS bridge
        shell: bash
        run: |
          dotnet run --project tools/codesys-bridge/tests -c Release
          python tools/codesys-bridge/tests/test_job.py
          node scripts/build-codesys-bridge.cjs
          CODESYS_BRIDGE_EXE="$PWD/resources/codesys-bridge/CodesysBridge.exe" node e2e/codesysBridge.test.cjs

      # The Studio 5000 bridge (tools/studio5000-bridge): its own tests (.NET 8, a fake PC and SDK), the job script's
      # tests (python, a fake Logix Designer SDK), then the exe the installer ships, started through the app's client.
      - name: Studio 5000 bridge
        shell: bash
        run: |
          dotnet run --project tools/studio5000-bridge/tests -c Release
          python tools/studio5000-bridge/tests/test_job.py
          node scripts/build-studio5000-bridge.cjs
          STUDIO5000_BRIDGE_EXE="$PWD/resources/studio5000-bridge/Studio5000Bridge.exe" node e2e/studio5000Bridge.test.cjs

      - name: Build installer
        run: npm run dist:win
        env:
          # Unsigned for now (see docs/INSTALL-WINDOWS.md); don't look for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The ISA PLC Helper as the installer ships it, started the way the Claude desktop app starts it.
      - name: PLC Helper (installed)
        shell: bash
        run: APP_DIR=release/win-unpacked node e2e/plcHelper.packaged.cjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ISA-Auto-Programmer-Setup
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      # The update feed: a pre-release on the public releases-only repo (no source there, and no token in the
      # app: package.json build.publish). The app downloads it and installs when the user clicks Restart.
      - name: Publish update (integration branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/optimistic-maxwell-6nfcs6'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: yoska81/isa-autoprogrammer-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Update not published: add the repository secret RELEASES_TOKEN (a fine-grained token with Contents: write on $RELEASES_REPO only)."
            exit 0
          fi
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" release/*.exe release/*.exe.blockmap release/latest.yml --repo "$RELEASES_REPO" --prerelease \
            --title "ISA Auto Programmer $v" \
            --notes "Built from ${GITHUB_SHA::7} (integration branch). The desktop app downloads it by itself and installs it when you click Restart to update."

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/latest.yml \
            --title "ISA Auto Programmer $GITHUB_REF_NAME" \
            --notes "Windows installer. Download ISA-Auto-Programmer-Setup-*.exe and double-click it. See docs/INSTALL-WINDOWS.md."
