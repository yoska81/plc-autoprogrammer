name: Build VISION SYSTEM - QC (Windows)

on:
  push:
    branches: [main]
    paths:
      - "vision/**"
      - ".github/workflows/build-vision-windows.yml"
  pull_request:
    paths:
      - "vision/**"
      - ".github/workflows/build-vision-windows.yml"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run headless UI smoke test (test-image mode, no camera needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test_ui.py

      - name: Clean up smoke-test data artifacts
        run: |
          Remove-Item -Recurse -Force data\products -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force data\bad_products -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force data\difference_images -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force data\captures -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force database -ErrorAction SilentlyContinue

      - name: Build the Windows executable with PyInstaller
        run: pyinstaller vision_qc.spec --noconfirm --clean

      - name: Assemble the release package
        run: |
          $release = "release\VISION_SYSTEM_QC"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item -Recurse -Force dist\VISION_SYSTEM_QC\* $release
          Copy-Item -Recurse -Force docs\screenshots "$release\docs\screenshots"
          Copy-Item -Force packaging\README_FOR_WINDOWS_USER.txt $release
          Copy-Item -Force packaging\RUN_TEST_MODE.bat $release
          Copy-Item -Force packaging\RUN_REAL_CAMERA.bat $release
          Copy-Item -Force packaging\PROBE_CAMERAS.bat $release
          Compress-Archive -Path "$release\*" -DestinationPath VISION_SYSTEM_QC_WINDOWS.zip -Force

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VISION_SYSTEM_QC_WINDOWS
          path: vision/VISION_SYSTEM_QC_WINDOWS.zip
          if-no-files-found: error

      - name: Assemble the Developer Run (source) package
        run: |
          $devrun = "release\VISION_SYSTEM_QC_DEVRUN"
          New-Item -ItemType Directory -Force -Path $devrun | Out-Null
          Copy-Item -Recurse -Force core "$devrun\core"
          Copy-Item -Recurse -Force ui "$devrun\ui"
          Copy-Item -Recurse -Force machine_interface "$devrun\machine_interface"
          Copy-Item -Recurse -Force data\test_images "$devrun\data\test_images"
          Copy-Item -Recurse -Force docs\screenshots "$devrun\docs\screenshots"
          Get-ChildItem -Path $devrun -Recurse -Filter "__pycache__" -Directory | Remove-Item -Recurse -Force
          Copy-Item -Force requirements.txt $devrun
          Copy-Item -Force ui_main.py $devrun
          Copy-Item -Force main.py $devrun
          Copy-Item -Force SETUP_AND_RUN_WINDOWS.bat $devrun
          Copy-Item -Force RUN_TEST_MODE.bat $devrun
          Copy-Item -Force RUN_REAL_CAMERA.bat $devrun
          Copy-Item -Force PROBE_CAMERAS.bat $devrun
          Copy-Item -Force INSTALL_REQUIREMENTS.bat $devrun
          Copy-Item -Force packaging\README_DEVRUN.txt "$devrun\README_DEVRUN.txt"
          Copy-Item -Force packaging\README_FOR_WINDOWS_USER.txt "$devrun\README_FOR_WINDOWS_USER.txt"
          Compress-Archive -Path "$devrun\*" -DestinationPath VISION_SYSTEM_QC_DEVRUN_WINDOWS.zip -Force

      - name: Upload Developer Run package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VISION_SYSTEM_QC_DEVRUN_WINDOWS
          path: vision/VISION_SYSTEM_QC_DEVRUN_WINDOWS.zip
          if-no-files-found: error
